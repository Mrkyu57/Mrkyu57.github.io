---
layout: default
---

<!--포스트메인페이지/포스트의 기본양식-->

<div class="post_hero_section">
    <h1 class="post_title">
        <span class="post_korean">{{ page.koreantitle }}</span>
        <span class="post_english">{{ page.englishtitle }}</span> </h1>
    <p class="post_info">{{ page.info }}</p>
</div>

<div class="post_content">
    {{ content }}
</div>

<style>
    .post_hero_section {

        margin: -30px 0 50px 0; 
        padding: 80px 40px; 
        color: white;
        text-align: left;
        background-color: {{ page.color }}; 
        width: 100%;
        box-sizing: border-box;
    }
    
    .post_title { margin: 0; line-height: 1.2; }
    .post_korean { font-size: clamp(2rem, 5vw, 3.5rem);
         font-weight: 800; letter-spacing: -2px; margin-right: 10px; }
    .post_english { font-size: 1.5rem; font-weight: 300; opacity: 0.8; }
    .post_info { margin-top: 15px; font-size: 1.1rem; opacity: 0.9; }
    
    .post_content {
        max-width: 800px;
        margin: 0 auto;   
        padding: 0 20px;
        line-height: 1.8;
        box-sizing: border-box; 
    }

    canvas, img {
        max-width: 100%;
        height: auto;
    }
</style>
